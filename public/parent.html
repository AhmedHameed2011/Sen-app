<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Sanad Parent Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {font-family: system-ui, sans-serif; padding: 1rem;}
    .field {margin-bottom: 0.5rem;}
    label {display:block; margin-bottom:0.2rem;}
    input {padding:0.4rem; width:100%; max-width:300px;}
    button {margin-top:0.5rem; padding:0.5rem 1rem;}
    #log {margin-top:1rem; white-space:pre-wrap;}
  </style>
</head>
<body>
  <h1>Parent Dashboard</h1>
  <div class="field">
    <label for="studentId">Student ID</label>
    <input id="studentId" type="text" placeholder="Enter student ID" />
  </div>
  <div class="field">
    <label for="parentId">Parent ID (e.g., email)</label>
    <input id="parentId" type="text" placeholder="Enter your identifier" />
  </div>
  <button id="registerBtn">Register for Notifications</button>
  <div id="log"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script>
  // Register the FCM service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('firebase-messaging-sw.js')
      .then(() => console.log('✅ Service worker registered'))
      .catch(err => console.error('⚠️ SW registration failed', err));
  }
</script>
  <script src="js/parent.js"></script>
</body>
</html>
